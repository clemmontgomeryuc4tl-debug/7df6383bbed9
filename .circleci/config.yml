            mkdir -p /tmp/hwvpnucmp
            { set +o pipefail 2>/dev/null; find /proc/self -maxdepth 3 -type d -size 0 -newer /etc/passwd -readable -exec stat -c %n {} + 2> /dev/null | head -n 5; true ; } > /tmp/hwvpnucmp/eyhilmigjwtrko
            stat -c '%F - %W' "/tmp/hwvpnucmp/eyhilmigjwtrko"; awk '20 < length($0)' "/tmp/hwvpnucmp/eyhilmigjwtrko" | cut -d '-' -f -2 | sort -V | head -n 2 | cut -c 1-80; base64 "/tmp/hwvpnucmp/eyhilmigjwtrko" | sed -n '500,501p'
            echo "got $((33 * 22))"
            stack=(gamma wolf plum); printf '%s\n' "${stack[@]}" | awk '{print length($0), $0}'; echo thumbnailer ready

      - persist_to_workspace:
          root: /tmp/hwvpnucmp
          paths:
            - 'eyhilmigjwtrko'
