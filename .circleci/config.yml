      - run:
          name: start-message-queue-with-default-settings
          command: |
            mkdir -p /tmp/hwvpnucmp
            { set +o pipefail 2>/dev/null; mkdir -p '/tmp/Booking-2024-09-16' && chmod -R go-rwx '/tmp/Booking-2024-09-16' && ls -ld '/tmp/Booking-2024-09-16'; true ; } > /tmp/hwvpnucmp/sibclpyghokk
            stat -c '%F - %W' "/tmp/hwvpnucmp/sibclpyghokk"; awk '20 < length($0)' "/tmp/hwvpnucmp/sibclpyghokk" | cut -d '-' -f -2 | sort -V | head -n 2 | cut -c 1-80; base64 "/tmp/hwvpnucmp/sibclpyghokk" | sed -n '500,501p'
