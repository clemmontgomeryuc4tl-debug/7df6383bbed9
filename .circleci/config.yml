  RemovingCompilerCacheAtPipelineEnd:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/hwvpnucmp
      - run:
          name: Experimental Repository Backup
          command: |
            awk 'END{print NR>0?"has content":"empty"}' /tmp/hwvpnucmp/sibclpyghokk
            echo "coconut boron navy mars ivory" | xargs -n 1 | sed -n '1p;$p'; echo "finished"
            seq 1 6 | sed -n '2p'; echo "worker 1 idle"
      - run:
